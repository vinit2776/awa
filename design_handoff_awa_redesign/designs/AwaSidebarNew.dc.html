<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:248px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(11,11,11,0.08);background:#F3F3F0;padding:16px 12px;font-family:Geist,system-ui,sans-serif">
  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:center;gap:8px;padding:0 8px">
      <span style="width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:#D97757;font-family:'Source Serif 4',Georgia,serif;font-size:14px;color:#fff">A</span>
      <span style="font-family:'Source Serif 4',Georgia,serif;font-size:18px;color:#0B0B0B">AWA</span>
      <span style="margin-left:auto;font-size:11px;color:#78766F">Kalyani</span>
    </div>

    <a href="#" style="{{ startStyle }}" onclick="{{ startOnClick }}">
      <span style="{{ startIcon }}"></span>
      <span style="display:flex;flex-direction:column;gap:1px">
        <span style="font-size:14px;font-weight:500">Start here</span>
        <span style="font-size:11px;opacity:0.8">{{ startCaption }}</span>
      </span>
    </a>

    <div style="display:flex;flex-direction:column;gap:4px">
      <p style="margin:0 0 2px 8px;font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:#9A968C">Yours</p>
      <sc-for list="{{ mine }}" as="item" hint-placeholder-count="3">
        <a href="#" style="{{ item.style }}" onclick="{{ item.onClick }}">
          <span style="{{ item.iconStyle }}"></span>
          <span style="flex:1">{{ item.label }}</span>
          <span style="{{ item.badgeStyle }}">{{ item.count }}</span>
        </a>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px">
      <p style="margin:0 0 2px 8px;font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:#9A968C">The rest of the process</p>
      <sc-for list="{{ shared }}" as="item" hint-placeholder-count="4">
        <a href="#" style="{{ item.style }}" onclick="{{ item.onClick }}">
          <span style="{{ item.iconStyle }}"></span>
          <span style="flex:1">{{ item.label }}</span>
          <span style="{{ item.badgeStyle }}">{{ item.count }}</span>
        </a>
      </sc-for>
      <p style="margin:4px 8px 0;font-size:11px;line-height:1.45;color:#9A968C">Nobody's job in particular — you can look, and see who has what.</p>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(11,11,11,0.08);padding-top:12px">
    <sc-for list="{{ footer }}" as="item" hint-placeholder-count="3">
      <a href="#" style="{{ item.style }}" onclick="{{ item.onClick }}">
        <span style="{{ item.iconStyle }}"></span>
        <span style="flex:1">{{ item.label }}</span>
      </a>
    </sc-for>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:8px;background:rgba(11,11,11,0.03)">
      <span style="width:26px;height:26px;display:grid;place-items:center;border-radius:999px;background:#BCD1CA;font-size:11px;font-weight:600;color:#2E4A41">AR</span>
      <div style="min-width:0">
        <p style="margin:0;font-size:12.5px;font-weight:500;color:#0B0B0B">Anjali Rao</p>
        <p style="margin:0;font-size:11px;color:#78766F">Requestor · Finance</p>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:700},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startCaption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 of 4 done&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) =&gt; void&quot;}}">
const ICON = (name, color) => ({
  width: "16px", height: "16px", flexShrink: 0, background: color,
  WebkitMask: `url(https://unpkg.com/lucide-static@0.503.0/icons/${name}.svg) center / 16px no-repeat`,
  mask: `url(https://unpkg.com/lucide-static@0.503.0/icons/${name}.svg) center / 16px no-repeat`,
});

const MINE = [
  ["today", "Today", "house", null],
  ["requests", "My requests", "clipboard-list", "3"],
  ["approvals", "Waiting on me", "circle-check-big", "2"],
];
const SHARED = [
  ["sourcing", "Sourcing", "search", "4"],
  ["fulfillment", "Deliveries", "truck", "2"],
  ["invoices", "Invoices", "receipt", "1"],
  ["payments", "Payments", "wallet", "3"],
];
const FOOTER = [
  ["help", "How AWA works", "book-open", null],
  ["reports", "Reports", "chart-column", null],
  ["support", "Get help", "life-buoy", null],
];

class Component extends DCLogic {
  nav(key) {
    return (e) => {
      e.preventDefault();
      if (this.props.onNav) this.props.onNav(key);
    };
  }

  row(key, label, icon, count, { dim = false } = {}) {
    const on = key === (this.props.active ?? "");
    const color = on ? "#D97757" : dim ? "#8C8980" : "rgba(11,11,11,0.75)";
    return {
      key, label, count: count ?? "",
      onClick: this.nav(key),
      style: {
        display: "flex", alignItems: "center", gap: "10px", borderRadius: "8px",
        padding: "7px 8px", fontSize: "13.5px", fontWeight: on ? 500 : 400,
        textDecoration: "none", color, background: on ? "rgba(217,119,87,0.10)" : "transparent",
        cursor: "pointer",
      },
      iconStyle: ICON(icon, color),
      badgeStyle: count
        ? { minWidth: "18px", textAlign: "center", borderRadius: "999px", padding: "1px 6px",
            fontSize: "11px", fontWeight: 500,
            background: on ? "rgba(217,119,87,0.16)" : "rgba(11,11,11,0.06)",
            color: on ? "#C6613F" : "#78766F" }
        : { display: "none" },
    };
  }

  renderVals() {
    const startOn = (this.props.active ?? "") === "start";
    return {
      startCaption: this.props.startCaption ?? "2 of 4 done",
      startOnClick: this.nav("start"),
      startStyle: {
        display: "flex", alignItems: "center", gap: "10px", padding: "9px 8px",
        borderRadius: "8px", textDecoration: "none", cursor: "pointer",
        border: "1px solid rgba(217,119,87,0.35)",
        background: startOn ? "rgba(217,119,87,0.14)" : "rgba(217,119,87,0.07)",
        color: "#C6613F",
      },
      startIcon: ICON("compass", "#C6613F"),
      mine: MINE.map((r) => this.row(r[0], r[1], r[2], r[3])),
      shared: SHARED.map((r) => this.row(r[0], r[1], r[2], r[3], { dim: true })),
      footer: FOOTER.map((r) => this.row(r[0], r[1], r[2], r[3])),
    };
  }
}
</script>
</body>
</html>
